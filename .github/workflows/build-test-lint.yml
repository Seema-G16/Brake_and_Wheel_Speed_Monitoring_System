name: Build, Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang]
        exclude:
          # Skip clang on Windows (use MSVC instead)
          - os: windows-latest
            compiler: clang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: cmake-actions/cmake-action@v3
        with:
          version: '3.20.x'

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install cppcheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cppcheck

      - name: Install cppcheck (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cppcheck -y
        shell: powershell

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Run unit tests
        run: |
          cd build
          ctest --verbose --output-on-failure

      - name: Run cppcheck linting
        if: runner.os == 'Linux'
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --std=c++17 \
            --error-exitcode=1 \
            src/ include/ tests/

      - name: Run cppcheck linting (Windows)
        if: runner.os == 'Windows'
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem `
            --std=c++17 `
            --error-exitcode=1 `
            src/ include/ tests/
        shell: powershell

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: cmake-actions/cmake-action@v3
        with:
          version: '3.20.x'

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang build-essential

      - name: Configure CMake with clang-tidy
        run: |
          cmake -B build \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy;--checks=-*,readability-*,performance-*,modernize-*"

      - name: Build with clang-tidy
        run: cmake --build build

  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: cmake-actions/cmake-action@v3
        with:
          version: '3.20.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcov lcov

      - name: Configure CMake with coverage
        run: |
          cmake -B build \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build project
        run: cmake --build build

      - name: Run tests for coverage
        run: |
          cd build
          ctest --verbose

      - name: Generate coverage report
        run: |
          cd build
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '*/googletest/*' '*/tests/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/coverage.info
          flags: unittests
          name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  status-check:
    needs: [build-and-test, clang-tidy, code-coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "❌ Build/Test job failed"
            exit 1
          fi
          if [[ "${{ needs.clang-tidy.result }}" == "failure" ]]; then
            echo "❌ Clang-tidy job failed"
            exit 1
          fi
          if [[ "${{ needs.code-coverage.result }}" == "failure" ]]; then
            echo "❌ Code coverage job failed"
            exit 1
          fi
          echo "✅ All checks passed!"
